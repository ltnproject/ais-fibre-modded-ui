<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="description" content="AIS Fibre Router Admin Panel — Modern UI"/>
<title>AIS Fibre — Router Admin</title>
<link rel="shortcut icon" href="img/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<!-- ── ROUTER BASE URL ─────────────────────────────────────────────────── -->
<!-- All API calls go to this origin. Change if your router IP differs.    -->
<script>
  var ROUTER_BASE = "http://192.168.1.1";
</script>

<style>
/* ═══════════════════════════════════════════════════════════════════
   RESET & TOKENS
══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:            #0a0f1e;
  --surface:       rgba(255,255,255,0.05);
  --surface-hover: rgba(255,255,255,0.09);
  --border:        rgba(255,255,255,0.10);
  --border-focus:  rgba(141,198,63,0.70);
  --green:         #8dc63f;
  --green-glow:    rgba(141,198,63,0.30);
  --green-dark:    #6aa52d;
  --text:          #e8edf5;
  --text-muted:    rgba(232,237,245,0.50);
  --error:         #ff5c5c;
  --error-bg:      rgba(255,92,92,0.12);
  --radius:        16px;
  --radius-sm:     10px;
  --shadow:        0 24px 64px rgba(0,0,0,0.55);
  --transition:    0.22s cubic-bezier(0.4,0,0.2,1);
}

html, body {
  min-height: 100%;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* ═══════════════════════════════════════════════════════════════════
   ANIMATED BACKGROUND MESH
══════════════════════════════════════════════════════════════════ */
.bg-mesh {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(141,198,63,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%,  rgba(52,120,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 70% 40% at 50% 50%,  rgba(141,198,63,0.04) 0%, transparent 70%);
  animation: meshPulse 8s ease-in-out infinite alternate;
}
@keyframes meshPulse {
  from { opacity: 0.7; }
  to   { opacity: 1;   }
}

.grid-lines {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ═══════════════════════════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════════════════════════ */
.page-wrap {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ─── TOP BAR ─── */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 36px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,15,30,0.70);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.top-bar .brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.top-bar .brand img {
  height: 32px;
  object-fit: contain;
}
.top-bar .brand-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

.status-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 5px 14px;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: dotBlink 2s ease-in-out infinite;
}
@keyframes dotBlink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

/* ─── MAIN CONTENT ─── */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

/* ─── LOGIN CARD ─── */
.login-card {
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 44px 40px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: var(--shadow), 0 0 0 1px rgba(141,198,63,0.05);
  animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)   scale(1);    }
}

/* logo inside card */
.card-logo {
  text-align: center;
  margin-bottom: 32px;
}
.card-logo img {
  height: 48px;
  object-fit: contain;
  filter: drop-shadow(0 0 16px var(--green-glow));
}
.card-logo .card-title {
  font-size: 22px;
  font-weight: 600;
  margin-top: 16px;
  background: linear-gradient(135deg, #fff 30%, var(--green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.card-logo .card-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ─── FORM FIELDS ─── */
.field {
  margin-bottom: 18px;
}
.field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.input-wrap {
  position: relative;
}
.input-wrap .icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  opacity: 0.4;
  pointer-events: none;
  transition: opacity var(--transition);
}
.input-wrap input:focus ~ .icon,
.input-wrap input:not(:placeholder-shown) ~ .icon {
  opacity: 0.8;
}

.field input[type="text"],
.field input[type="password"] {
  width: 100%;
  height: 50px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 0 14px 0 42px;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
  -webkit-text-security: none;
}
.field input[type="text"]::placeholder,
.field input[type="password"]::placeholder {
  color: rgba(255,255,255,0.20);
}
.field input[type="text"]:focus,
.field input[type="password"]:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--green-glow);
  background: rgba(141,198,63,0.05);
}

/* password toggle */
.pw-toggle {
  position: absolute;
  right: 13px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  opacity: 0.35;
  transition: opacity var(--transition);
  background: none;
  border: none;
  color: var(--text);
  padding: 4px;
  display: flex;
  align-items: center;
}
.pw-toggle:hover { opacity: 0.75; }

/* captcha row */
.captcha-row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.captcha-row input {
  flex: 1;
}
#captchaImg {
  height: 50px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  cursor: pointer;
}
#captchaArea { display: none; }

/* ─── ERROR HINT ─── */
.error-box {
  display: none;
  background: var(--error-bg);
  border: 1px solid rgba(255,92,92,0.25);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  font-size: 13px;
  color: var(--error);
  margin-bottom: 18px;
  animation: shake 0.4s cubic-bezier(0.36,0.07,0.19,0.97);
}
@keyframes shake {
  10%,90% { transform: translateX(-2px); }
  20%,80% { transform: translateX(4px);  }
  30%,50%,70% { transform: translateX(-5px); }
  40%,60% { transform: translateX(5px);  }
}

/* ─── SIGN IN BUTTON ─── */
.btn-signin {
  width: 100%;
  height: 50px;
  margin-top: 6px;
  background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
  box-shadow: 0 4px 24px rgba(141,198,63,0.30);
}
.btn-signin::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
  opacity: 0;
  transition: opacity var(--transition);
}
.btn-signin:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(141,198,63,0.45); }
.btn-signin:hover::before { opacity: 1; }
.btn-signin:active { transform: translateY(0); }
.btn-signin:disabled { filter: grayscale(0.5); opacity: 0.6; cursor: not-allowed; transform: none; }

/* spinner inside button */
.btn-signin .spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto;
}
.btn-signin.loading .btn-text  { display: none; }
.btn-signin.loading .spinner   { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── HIDDEN FIELDS (needed by router JS) ─── */
input[type="hidden"] { display: none !important; }

/* ─── FOOTER ─── */
.footer {
  text-align: center;
  padding: 20px;
  font-size: 11px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  background: rgba(10,15,30,0.50);
}
.footer a { color: var(--text-muted); text-decoration: none; }
.footer a:hover { color: var(--text); }

/* ─── WAIT OVERLAY ─── */
#waitOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(10,15,30,0.75);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}
#waitOverlay.active { display: flex; }
.wait-ring {
  width: 48px; height: 48px;
  border: 3px solid rgba(141,198,63,0.20);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
.wait-label { font-size: 13px; color: var(--text-muted); }

/* ─── RESPONSIVE ─── */
@media (max-width: 480px) {
  .login-card { padding: 36px 24px 30px; }
  .top-bar { padding: 14px 20px; }
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════════
   ROUTER PROXY — rewrite all XHR/fetch to go to ROUTER_BASE
   so GitHub Pages can communicate with the local router.
══════════════════════════════════════════════════════════════════ */
(function () {
  var _open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    if (url && url.indexOf('http') !== 0 && url.indexOf('//') !== 0) {
      url = ROUTER_BASE + (url.charAt(0) === '/' ? '' : '/') + url;
    }
    return _open.apply(this, [method, url].concat(Array.prototype.slice.call(arguments, 2)));
  };
})();

/* ══════════════════════════════════════════════════════════════════
   WAIT OVERLAY — override common_lib showWaitTip
══════════════════════════════════════════════════════════════════ */
function showWaitTip(show) {
  var overlay = document.getElementById('waitOverlay');
  if (show) { overlay.classList.add('active'); }
  else       { overlay.classList.remove('active'); }
}

/* ══════════════════════════════════════════════════════════════════
   PASSWORD TOGGLE
══════════════════════════════════════════════════════════════════ */
document.getElementById('pwToggle').addEventListener('click', function () {
  var inp  = document.getElementById('Frm_Password');
  var open = document.getElementById('eyeOpen');
  var cls  = document.getElementById('eyeClosed');
  if (inp.type === 'password') {
    inp.type = 'text';
    inp.classList.remove('SpecialPassword');
    open.style.display = 'none';
    cls.style.display  = 'block';
  } else {
    inp.type = 'password';
    inp.classList.add('SpecialPassword');
    open.style.display = 'block';
    cls.style.display  = 'none';
  }
});

/* ══════════════════════════════════════════════════════════════════
   CAPTCHA REFRESH
══════════════════════════════════════════════════════════════════ */
document.getElementById('captchaImg').addEventListener('click', function () {
  this.src = ROUTER_BASE + '/?_type=loginData&_tag=captchaImg&rand=' + Date.now();
});

/* ══════════════════════════════════════════════════════════════════
   LOGIN — sends credentials to the real router
══════════════════════════════════════════════════════════════════ */
function showLoginError(msg) {
  var box = document.getElementById('login_error');
  document.getElementById('login_error_span').textContent = msg || 'Login failed. Please try again.';
  box.style.display = 'block';
  box.style.animation = 'none';
  box.offsetHeight; // reflow
  box.style.animation = '';
}

function doLogin() {
  var btn      = document.getElementById('LoginId');
  var username = document.getElementById('Frm_Username').value.trim();
  var password = document.getElementById('Frm_Password').value;
  var token    = document.getElementById('_sessionTOKEN').value;
  var captcha  = document.getElementById('Frm_captchaCode').value;

  if (!username) {
    showLoginError('Please enter your username.');
    document.getElementById('Frm_Username').focus();
    return;
  }
  if (!password) {
    showLoginError('Please enter your password.');
    document.getElementById('Frm_Password').focus();
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;
  document.getElementById('login_error').style.display = 'none';

  /* Build post data — mirrors the original router login logic */
  var postData = {
    action:         'login',
    _sessionTOKEN:  token,
    IF_ACTION:      'Submit',
    Frm_Username:   username,
    Frm_Password:   password
  };
  if (captcha) { postData.Frm_captchaCode = captcha; }

  /* Encrypt password using RSA if jsencrypt is available */
  try {
    if (typeof JSEncrypt !== 'undefined') {
      var encrypt = new JSEncrypt();
      /* Public key fetched on page load; fallback to raw if unavailable */
      if (window._routerPubKey) {
        encrypt.setPublicKey(window._routerPubKey);
        var enc = encrypt.encrypt(password);
        if (enc) { postData.Frm_Password = enc; }
      }
    }
  } catch(e) {}

  $.ajax({
    type:     'POST',
    url:      ROUTER_BASE + '/?_type=loginData&_tag=login_entry',
    data:     postData,
    dataType: 'json',
    xhrFields: { withCredentials: true },
    timeout:  8000
  })
  .done(function (data) {
    if (data && data.need_refresh) {
      /* Success — redirect to the (now-authenticated) router admin */
      window.location.href = ROUTER_BASE + '/';
    } else if (data && data.IF_ERRORPARAM) {
      showLoginError(data.IF_ERRORPARAM);
    } else {
      /* Try a direct redirect anyway — the session cookie may be set */
      window.location.href = ROUTER_BASE + '/';
    }
  })
  .fail(function (xhr) {
    if (xhr.status === 0) {
      showLoginError('Cannot reach the router. Make sure you are connected to your AIS Fibre Wi-Fi.');
    } else {
      showLoginError('Login failed (HTTP ' + xhr.status + '). Please try again.');
    }
  })
  .always(function () {
    btn.classList.remove('loading');
    btn.disabled = false;
  });
}

/* ══════════════════════════════════════════════════════════════════
   ENTER KEY SUPPORT
══════════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && document.getElementById('loginWrapper').style.display !== 'none') {
    doLogin();
  }
});

/* ══════════════════════════════════════════════════════════════════
   FETCH SESSION TOKEN on load
══════════════════════════════════════════════════════════════════ */
$(document).ready(function () {
  /* Fetch the login page from the real router to get session token & RSA key */
  $.ajax({
    type:  'GET',
    url:   ROUTER_BASE + '/?_type=loginData&_tag=login_entry',
    dataType: 'json',
    xhrFields: { withCredentials: true },
    timeout: 5000
  })
  .done(function (data) {
    if (data && data._sessionTOKEN) {
      $('#_sessionTOKEN').val(data._sessionTOKEN);
    }
    if (data && data.PubKey) {
      window._routerPubKey = data.PubKey;
    }
    if (data && data.showCaptcha === '1') {
      $('#captchaArea').show();
      $('#captchaImg').attr('src', ROUTER_BASE + '/?_type=loginData&_tag=captchaImg&rand=' + Date.now());
    }
  });

  /* Also call FakeClass1MenuShow if defined by common_lib */
  if (typeof FakeClass1MenuShow === 'function') { FakeClass1MenuShow(); }
});
